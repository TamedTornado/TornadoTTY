[workspace]
resolver = "3"
members = [
    "crates/zentty-api",
    "crates/zentty-core",
    "crates/zentty-ghostty-sys",
    "crates/zentty-ghostty",
    "crates/zentty-agent-ipc",
    "crates/zentty-linux",
    "crates/zentty-test-support",
    "crates/zentty-tmux-compat",
    "crates/tornadotty-test-receipts",
]

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-only"
repository = "https://github.com/TamedTornado/TornadoTTY"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# The pinned nightly promotes this assertion-style preference into pedantic.
# `assert!(collection.is_empty())` remains clearer when the collection's item
# type has no useful empty-value diagnostic.
assert_is_empty = "allow"

[profile.release-safe]
inherits = "release"
debug = true
debug-assertions = true
overflow-checks = true
