[workspace]
resolver = "3"
members = [
    "crates/zentty-api",
    "crates/zentty-core",
    "crates/zentty-ghostty-sys",
    "crates/zentty-ghostty",
    "crates/zentty-agent-ipc",
    "crates/zentty-linux",
    "crates/zentty-test-support",
    "crates/zentty-tmux-compat",
]

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-only"
repository = "https://github.com/TamedTornado/zentty"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

[profile.release-safe]
inherits = "release"
debug = true
debug-assertions = true
overflow-checks = true
