name: Linux advisory regression checks

on:
  pull_request:
    branches:
      - linux/port
  push:
    branches:
      - linux/port
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-ci-gate-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controlled-pr-subset:
    name: Real controlled X11 and Wayland subset
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC
      XKB_DEFAULT_LAYOUT: us
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      GSETTINGS_BACKEND: memory
      GIO_USE_VFS: local
      ZENTTY_BUILD_JOBS: "2"
      ZENTTY_CI_QUALIFICATION_PROFILE: public-pr
      ZENTTY_EXPECTED_COMMIT: ${{ github.sha }}

    steps:
      - name: Check out exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install reviewed Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          check-latest: false

      # This literal list is contract-checked against environment-v1.json. It
      # must never be generated by code from an untrusted pull request.
      - name: Install reviewed Ubuntu qualification packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/linux
          packages=(
            alsa-utils appstream bubblewrap build-essential cage cmake curl dbus-x11
            desktop-file-utils dpkg-dev extra-cmake-modules fcitx5
            fcitx5-frontend-gtk4 fcitx5-table-cangjie5 fish fontconfig fuse3
            gir1.2-gtk-4.0 git ibus ibus-gtk4 jq libadwaita-1-dev libcairo2-dev
            libfontconfig-dev libglib2.0-dev libgtk-4-dev libnotify-bin libwayland-dev
            libx11-dev libxkbcommon-dev libxml2-utils mesa-utils meson ninja-build
            openssh-client patchelf pkg-config procps python3 python3-gi
            python3-jsonschema shellcheck socat tmux util-linux wayland-utils weston
            wl-clipboard wtype x11-utils xauth xclip xdg-utils xdotool
            xsettingsd xvfb zsh
          )
          sudo timeout --signal=TERM --kill-after=30s 600s \
            apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update \
            2>&1 | tee build/linux/ci-apt-update.log
          sudo env DEBIAN_FRONTEND=noninteractive \
            timeout --signal=TERM --kill-after=30s 600s \
            apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            install -y --no-install-recommends "${packages[@]}" \
            2>&1 | tee build/linux/ci-apt-install.log
          if [[ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] &&
            [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" == 1 ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
              2>&1 | tee build/linux/ci-userns-policy.log
          fi

      - name: Bootstrap content-pinned tools
        shell: bash
        run: |
          set -euo pipefail
          linux/ci/bootstrap-ubuntu-24.04 --no-system-install \
            2>&1 | tee build/linux/ci-bootstrap.log

      - name: Prepare exact sources and preflight environment
        shell: bash
        run: |
          set -euo pipefail
          source build/linux-ci-tools/environment.sh
          linux/scripts/prepare-ghostty-source \
            2>&1 | tee build/linux/ci-prepare-ghostty.log
          linux/ci/preflight 2>&1 | tee build/linux/ci-preflight.log
          linux/ci/validate-preflight-receipt

      - name: Run selected real-system regression checks
        shell: bash
        run: |
          set -euo pipefail
          source build/linux-ci-tools/environment.sh
          linux/ci/run-pr-subset

      - name: Revalidate preflight receipt
        if: always()
        shell: bash
        run: linux/ci/validate-preflight-receipt

      - name: Summarize advisory check result
        if: always()
        shell: bash
        run: |
          {
            echo '### Linux advisory regression checks'
            if [[ -f build/linux/ci-pr-subset-summary.json ]] &&
              linux/ci/pr-subset-result validate-summary build/linux/ci-pr-subset-summary.json >/dev/null; then
              jq -r '"Selected checks: " + (if .claims.public_pr_subset_passed then "PASSED" else "FAILED" end)' \
                build/linux/ci-pr-subset-summary.json
            else
              echo 'Selected checks: NOT_ESTABLISHED'
            fi
            echo 'Implemented local suite: NOT_CLAIMED'
            echo 'Release qualification: NOT_CLAIMED'
            echo 'Full Linux qualification: NOT_CLAIMED'
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Upload debugging logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-ci-gate-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            linux/ci/pr-subset-v1.json
            build/linux/ci-*.json
            build/linux/ci-*.log
            build/linux/ci-pr-subset-summary.json
            build/linux/ci-pr-subset-logs
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
