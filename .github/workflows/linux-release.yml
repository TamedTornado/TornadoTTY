name: Linux release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tornadotty-v<version> tag to package
        required: true
        type: string
      publish:
        description: Publish the validated bundle as a GitHub prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: linux-release-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-native-packages:
    name: Build Ubuntu and Arch packages
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ZENTTY_RELEASE_TAG: ${{ inputs.tag }}
      ZENTTY_BUILD_JOBS: "2"
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install reviewed Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          check-latest: false

      - name: Install Ubuntu package-build dependencies
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(linux/ci/bootstrap-ubuntu-24.04 --print-apt)
          sudo apt-get -o Acquire::Retries=3 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends "${packages[@]}"

      - name: Bootstrap pinned tools and Ghostty
        shell: bash
        run: |
          set -euo pipefail
          linux/ci/bootstrap-ubuntu-24.04 --no-system-install
          source build/linux-ci-tools/environment.sh
          cargo fetch --locked
          linux/scripts/prepare-ghostty-source
          (
            cd build/linux-deps/ghostty
            PATH="${BLUEPRINT_COMPILER_DIR}:$(dirname "${ZIG}"):${PATH}" \
              ZIG_GLOBAL_CACHE_DIR="${GITHUB_WORKSPACE}/build/linux-deps/zig-global-cache" \
              ZIG_LOCAL_CACHE_DIR="${GITHUB_WORKSPACE}/build/linux-deps/ghostty/.zig-cache-release-fetch" \
              "${ZIG}" build gtk-embed-lib --fetch=all \
                -Doptimize=ReleaseSafe \
                -Dcpu=baseline \
                -Demit-terminfo=true \
                -fsys=fontconfig \
                -fno-sys=gtk4-layer-shell
          )
          test -d build/linux-deps/zig-global-cache/p

      - name: Build tagged Ubuntu package
        shell: bash
        run: |
          set -euo pipefail
          source build/linux-ci-tools/environment.sh
          ZENTTY_GHOSTTY_PREPARED=true linux/scripts/build-deb

      - name: Build tagged Arch package
        shell: bash
        run: linux/scripts/build-arch-in-container

      - name: Validate and assemble release bundle
        shell: bash
        run: |
          set -euo pipefail
          version="${ZENTTY_RELEASE_TAG#tornadotty-v}"
          linux/scripts/prepare-release-bundle "${ZENTTY_RELEASE_TAG}" \
            "build/linux-package/tornadotty_${version}_amd64.deb" \
            "build/linux-package/tornadotty_${version}_amd64.manifest.json" \
            "build/linux-package/tornadotty_${version}_amd64.provenance.json" \
            "build/linux-arch-package/tornadotty-${version}-1-x86_64.pkg.tar.zst" \
            "build/linux-arch-package/tornadotty-${version}-1-x86_64.manifest.json" \
            "build/linux-arch-package/tornadotty-${version}-1-x86_64.provenance.json" \
            build/linux-release-bundle

      - name: Upload validated release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tornadotty-${{ inputs.tag }}-release-bundle
          path: build/linux-release-bundle
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish-prerelease:
    name: Publish GitHub prerelease
    if: ${{ inputs.publish }}
    needs: build-native-packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out exact release tag without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download validated release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tornadotty-${{ inputs.tag }}-release-bundle
          path: build/linux-release-bundle

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: linux/scripts/publish-release "${{ inputs.tag }}" build/linux-release-bundle
